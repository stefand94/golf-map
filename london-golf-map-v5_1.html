<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf Tripper</title>

<!-- GOLF-80/PWA basics: installable app shell. Progressive enhancement only
     — browsers that don't understand manifest/service-worker just ignore
     these and the site works exactly as before. See sw.js for the offline
     strategy and docs/pwa.md for the full write-up. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E5C8A">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/icon.svg">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Design refresh v2: dropped the separate monospace font entirely —
     --font-mono now just aliases --font-sans, with tabular-nums applied
     directly to the few number-bearing classes (.cart-fee, .cart-total-amount,
     .cfee, .fee-box span, #hc-out) so figures stay aligned without reading
     as code. Palette moved from the warm teal to "Links navy": --stone
     #5C6672 clears WCAG AA against both --paper (5.41:1) and --paper-2
     (5.31:1); --ink #1B2733 clears 14.07:1 against --paper (near-AAA);
     --accent #2E5C8A clears 6.33:1 as text on --paper-2 and 6.96:1 as
     white-on-accent for button labels; --accent-dark #1B4266 clears 8.78:1
     against --accent-soft. --paper/-2 dropped the cream/sepia cast for a
     cool near-white (panel is #F5F7F9, cards stay pure #fff on top of it)
     so the navy accent reads crisp rather than sitting on an off-white
     wash; --stone still clears 5.05:1 against --paper and 5.68:1 against
     --paper-2. All verified by hand, same discipline as the original
     GOLF-18 fix. */
  :root{
    --font-display:"Space Grotesk",var(--font-sans);
    --font-sans:"Manrope",ui-sans-serif,system-ui,sans-serif;
    --font-mono:var(--font-sans);
    --ink:#1B2733;--ink-soft:#3E4C5A;--paper:#EDF1F4;--paper-2:#F5F7F9;--line:#DCE2E7;--stone:#5C6672;
    --accent:#2E5C8A;--accent-dark:#1B4266;--accent-soft:#E4EDF4;
    /* GOLF-57: Trip Builder sidebar redesign — accent-deep is the
       text-on-tint colour for hero golf-price/name text (darker than
       --accent-dark so it still reads clearly on the pale --accent-soft
       fills used for pills/tags); radius tokens are new, this is the
       first part of the app that wants rounded cards/pills consistently. */
    --accent-deep:#122f76;
    /* ── GOLF-71 design system ────────────────────────────────────────
       One radius scale, one elevation scale, one spacing scale, one type
       scale, one control-height scale. Everything in the Trip Builder
       pane (and the shared button/chip/card primitives it borrows from
       Explore) is expressed in these tokens — no more per-component
       6px/7px/8px/9px radii and one-off box-shadows accumulated across
       GOLF-31…69. Apple HIG informs three concrete choices: (1) a 44px
       minimum tap target, exposed as --tap and applied to every button,
       chip, tab and drag handle in the pane; (2) layered elevation —
       cards are a lighter surface than the panel behind them AND carry a
       shadow, so they read as objects rather than boxes; (3) restrained
       motion — .14s/.18s ease-out, and everything inside the existing
       prefers-reduced-motion kill switch. */
    /* Radius: xs for inline chips/tags, sm for inputs and small controls,
       md for buttons and inner blocks, lg for cards, xl for the sheet,
       pill for search bars / tab buttons / filter pills. */
    --radius-xs:6px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:22px;--radius-pill:9999px;
    /* Elevation. sm/md/lg are kept (used widely outside the pane);
       card/raised/dragging are the new named steps the redesign uses:
       card = at rest, raised = hover/active, dragging = lifted. */
    --shadow-sm:0 1px 2px rgba(27,39,51,.06),0 1px 1px rgba(27,39,51,.08);
    --shadow-md:0 4px 14px rgba(27,39,51,.10),0 2px 4px rgba(27,39,51,.08);
    --shadow-lg:0 14px 40px rgba(27,39,51,.18),0 4px 10px rgba(27,39,51,.10);
    --shadow-card:0 1px 2px rgba(27,39,51,.05),0 6px 16px -6px rgba(27,39,51,.14);
    --shadow-raised:0 2px 4px rgba(27,39,51,.06),0 14px 28px -10px rgba(27,39,51,.22);
    --shadow-dragging:0 24px 48px -12px rgba(27,39,51,.38),0 8px 16px -6px rgba(27,39,51,.22);
    --shadow-focus:0 0 0 3px var(--accent-soft);
    /* Spacing — a 4px grid. */
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
    /* Type scale. */
    --fs-micro:10px;--fs-caption:11.5px;--fs-small:12.5px;--fs-body:13.5px;
    --fs-title:15px;--fs-lg:17px;--fs-xl:20px;--fs-hero:38px;
    /* Control sizing. --tap is the HIG minimum; --tap-sm is for controls
       that sit inside a ≥44px row and so are already comfortably hit. */
    --tap:44px;--tap-sm:36px;
    --ease:cubic-bezier(.2,.7,.3,1);--dur:.16s;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  button,input,select,textarea{font-family:inherit}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  .skip-link{position:absolute;left:8px;top:-40px;background:var(--ink);color:var(--paper-2);padding:8px 14px;border-radius:5px;font:600 12.5px var(--font-sans);text-decoration:none;z-index:3000;transition:top .12s}
  .skip-link:focus{top:8px}
  .app{display:grid;grid-template-columns:minmax(360px,420px) 1fr;height:100vh}
  /* GOLF-19: the old fixed 50vh panel/map split clipped the panel with
     overflow:hidden — on a real phone this made the search box, sort
     dropdown, and every button below the filter chips completely
     unreachable (confirmed: filters content ran ~715px tall, capped at
     406px, no scroll). Replaced with a full-height list<->map toggle. */
  .mob-toggle{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:1500;
    background:var(--ink);color:var(--paper-2);border:none;border-radius:22px;padding:12px 22px;
    font:600 13px var(--font-sans);box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:1fr}
    .panel{max-height:none}
    body.mob-map .panel{display:none}
    body.mob-list #map{display:none}
    .mob-toggle{display:block}
  }
  .panel{display:flex;flex-direction:column;background:var(--paper-2);border-right:1px solid var(--line);overflow:hidden;box-shadow:6px 0 24px -12px rgba(22,36,29,.25);position:relative;z-index:10}

  /* GOLF-31: Trip Builder pane — replaces .filters/.list in the same grid
     column (no .app layout change), following the same body-class toggle
     idiom already used for the mobile mob-list/mob-map split above. */
  .tb-pane{display:none;flex-direction:column;overflow-y:auto;flex:1}
  body.trip-mode .filters,body.trip-mode .list{display:none}
  body.trip-mode .tb-pane{display:flex}
  /* GOLF-41: #trip is a real, bookmarkable/shareable route — give the pane
     more room than the constrained list-panel width once it's the whole
     point of the page (map stays visible throughout, just narrower). */
  @media (min-width:901px){
    body.trip-mode .app{grid-template-columns:minmax(480px,680px) 1fr}
  }
  /* ══════════════════════════════════════════════════════════════════
     GOLF-71 — Trip Builder pane, rebuilt on the design tokens above.
     Everything below uses --radius-*, --shadow-*, --sp-*, --fs-*, --tap.
     Structure follows the stakeholder's sketch, top to bottom:
       navbar → pill search bar → [Trip ▾][Filters ▾][Clear trip] →
       pill tabs → day cards → grand-total card.
     ══════════════════════════════════════════════════════════════════ */

  /* ── Shared pane primitives ─────────────────────────────────────── */
  /* .tb-btn is the one button primitive for the pane: a ≥44px pill with
     three variants (default = quiet surface, .is-primary = accent fill,
     .is-danger = destructive outline). It replaces the .btn2/.linkbtn
     mix that had accumulated inside the pane, where a "button" could be
     anything from a 14px underlined word to a gradient slab. */
  .tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
    min-height:var(--tap);padding:0 var(--sp-4);border-radius:var(--radius-pill);
    border:1px solid var(--line);background:#fff;color:var(--ink);
    font:var(--fw-semi,600) var(--fs-small)/1 var(--font-sans);cursor:pointer;white-space:nowrap;
    box-shadow:var(--shadow-sm);transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
  .tb-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .tb-btn:active{transform:translateY(0);box-shadow:var(--shadow-sm)}
  .tb-btn.is-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-md)}
  .tb-btn.is-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;box-shadow:var(--shadow-raised)}
  .tb-btn.is-danger{color:#9A3412;border-color:#E5C7B5;background:#fff;box-shadow:none}
  .tb-btn.is-danger:hover{background:#FBEEE7;color:#7C2D12;border-color:#D9A88E;box-shadow:none}
  .tb-btn.is-quiet{box-shadow:none;background:transparent}
  /* Compact variant: still 36px tall, only used inside a row that is
     itself already a comfortable target (e.g. a card header's ⋯ menu). */
  .tb-btn.is-sm{min-height:var(--tap-sm);padding:0 var(--sp-3);font-size:var(--fs-caption)}
  .tb-btn.is-icon{padding:0;width:var(--tap);flex:0 0 var(--tap);font-size:var(--fs-title)}
  .tb-btn.is-icon.is-sm{width:var(--tap-sm);flex:0 0 var(--tap-sm)}
  .tb-btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
  .tb-field{width:100%;min-height:var(--tap-sm);padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);
    border-radius:var(--radius-sm);background:#fff;font:400 var(--fs-small) var(--font-sans);color:var(--ink);
    transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .tb-field:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow-focus)}
  .tb-section{padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--line)}
  .tb-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}
  .tb-row:last-child{border-bottom:none}
  .tb-section-title{font:700 var(--fs-caption) var(--font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--stone);margin:0 0 var(--sp-2)}

  /* ── Pane chrome (sketch rows 1–4) ──────────────────────────────── */
  .tb-navbar{padding:var(--sp-3) var(--sp-5) var(--sp-1);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
  .tb-wordmark{font-family:var(--font-display);font-weight:700;font-size:var(--fs-title);color:var(--ink)}
  .tb-navbar-right{display:flex;align-items:center;gap:var(--sp-2)}
  .tb-pill{font:700 var(--fs-caption) var(--font-sans);background:var(--accent-soft);color:var(--accent-deep);
    padding:var(--sp-1) var(--sp-3);border-radius:var(--radius-pill);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* The single search bar for the whole pane — a full-width pill, per the
     sketch. One component, one look, four call sites (see tbSearchFieldHTML). */
  /* Sticky so the one search bar is always one tap away, however far the
     itinerary has been scrolled — it is the pane's only entry point. */
  .tb-place-wrap.tb-search-bar-wrap{padding:var(--sp-2) var(--sp-5);position:sticky;top:0;z-index:20;
    background:var(--paper-2);box-shadow:0 6px 12px -10px rgba(27,39,51,.5)}
  .tb-search-bar{width:100%;min-height:var(--tap);padding:0 var(--sp-4) 0 42px;border:1px solid var(--line);
    border-radius:var(--radius-pill);background:#fff;font:500 var(--fs-body) var(--font-sans);color:var(--ink);
    box-shadow:var(--shadow-card);transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .tb-search-bar::placeholder{color:var(--stone);font-weight:400}
  .tb-search-bar:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow-focus),var(--shadow-card)}
  .tb-search-bar-wrap::before{content:'';position:absolute;left:var(--sp-8);top:50%;transform:translateY(-50%);
    width:12px;height:12px;border:2px solid var(--stone);border-radius:50%;box-sizing:border-box;pointer-events:none}
  .tb-search-bar-wrap::after{content:'';position:absolute;left:41px;top:50%;transform:translateY(3px) rotate(45deg);
    width:2px;height:7px;background:var(--stone);border-radius:1px;pointer-events:none}

  /* Row 2 of the sketch: two (here three) equal rounded controls. */
  .tb-toolbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-5) var(--sp-2)}
  .tb-toolbar>*{flex:1 1 0;min-width:0}
  .tb-drop{position:relative;flex:1 1 0;min-width:0}
  .tb-drop>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
    min-height:var(--tap);padding:0 var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-pill);
    background:#fff;box-shadow:var(--shadow-sm);cursor:pointer;
    font:600 var(--fs-small)/1 var(--font-sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .tb-drop>summary::-webkit-details-marker{display:none}
  .tb-drop>summary::after{content:'';flex:0 0 auto;width:6px;height:6px;border-right:2px solid var(--stone);
    border-bottom:2px solid var(--stone);transform:translateY(-2px) rotate(45deg);transition:transform var(--dur) var(--ease)}
  .tb-drop[open]>summary{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-focus)}
  .tb-drop[open]>summary::after{transform:translateY(1px) rotate(-135deg)}
  .tb-drop-body{position:absolute;z-index:40;top:calc(100% + var(--sp-2));left:0;min-width:100%;width:max-content;max-width:min(320px,80vw);
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);
    padding:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-1)}
  .tb-drop-body.is-right{left:auto;right:0}
  /* Menu items inside a dropdown: full-width, 44px, left-aligned. */
  .tb-menu-item{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:var(--tap);
    padding:0 var(--sp-3);border:none;border-radius:var(--radius-sm);background:none;cursor:pointer;
    font:600 var(--fs-small) var(--font-sans);color:var(--ink);text-align:left;transition:background var(--dur) var(--ease)}
  .tb-menu-item:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .tb-menu-item.is-danger{color:#9A3412}
  .tb-menu-item.is-danger:hover{background:#FBEEE7}
  .tb-menu-sep{height:1px;background:var(--line);margin:var(--sp-1) 0}
  /* A stop row's own "⋯" menu (move to another day / remove). Replaces the
     bare <select> + tiny ✕ that used to sit in every row — the sketch shows
     a row as name + price, and a 12px select is exactly the "small, finicky
     button" the stakeholder called out. */
  .tb-rowmenu{position:relative;flex:0 0 auto}
  .tb-rowmenu>summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;
    width:var(--tap-sm);min-height:var(--tap-sm);border-radius:var(--radius-pill);cursor:pointer;
    color:var(--stone);font-size:var(--fs-title);line-height:1;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
  .tb-rowmenu>summary::-webkit-details-marker{display:none}
  .tb-rowmenu>summary:hover{background:var(--paper);color:var(--ink)}
  .tb-rowmenu[open]>summary{background:var(--accent-soft);color:var(--accent-deep)}
  .tb-menu-label{font:700 var(--fs-micro) var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
    color:var(--stone);padding:var(--sp-2) var(--sp-3) var(--sp-1)}

  /* Row 3 of the sketch: pill tabs. One row, three destinations, shown in
     both Plan and Build — Discover is Plan mode, Itinerary/Costs are Build. */
  .tb-tabs{display:flex;gap:var(--sp-1);margin:0 var(--sp-5) var(--sp-3);padding:var(--sp-1);
    background:var(--paper);border-radius:var(--radius-pill)}
  .tb-tab-btn{flex:1 1 0;min-height:var(--tap-sm);padding:0 var(--sp-2);border:none;border-radius:var(--radius-pill);
    background:transparent;color:var(--stone);cursor:pointer;
    font:700 var(--fs-small)/1 var(--font-sans);
    transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .tb-tab-btn:hover{color:var(--ink)}
  .tb-tab-btn[aria-pressed="true"]{background:#fff;color:var(--accent-deep);box-shadow:var(--shadow-sm)}
  .tb-tab-content{padding:0 var(--sp-5) var(--sp-8);flex:1}

  /* Segmented control (Discover's Near a place / Nearby / By region, and
     the itinerary type filter) — same visual language as the tab row, one
     step smaller. */
  .tb-seg{display:inline-flex;gap:var(--sp-1);padding:3px;background:var(--paper);border-radius:var(--radius-pill);flex-wrap:wrap}
  .tb-seg button{min-height:var(--tap-sm);padding:0 var(--sp-3);border:none;border-radius:var(--radius-pill);
    background:transparent;color:var(--stone);cursor:pointer;font:600 var(--fs-small)/1 var(--font-sans);
    transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  .tb-seg button:hover{color:var(--ink)}
  .tb-seg button[aria-pressed="true"]{background:#fff;color:var(--accent-deep);box-shadow:var(--shadow-sm)}

  /* ── Day cards (the heart of the sketch) ────────────────────────── */
  /* A card is a distinctly lighter surface than the panel, plus a real
     shadow — the stakeholder's "make sure the cards are distinct from the
     background". The panel is --paper-2 (#F5F7F9); cards are pure #fff. */
  .tb-day{position:relative;background:#fff;border:1px solid transparent;border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);margin-bottom:var(--sp-3);overflow:visible;
    transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease)}
  .tb-day-wish{background:var(--paper-2);border:1px dashed var(--line);box-shadow:none}
  /* Day kind reads as a coloured dot in the header now, not a slab of
     left border — the border competed with the golf rows' own accent rule. */
  .tb-day-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--accent)}
  .tb-day-start .tb-day-dot,.tb-day-end .tb-day-dot{background:var(--stone)}
  .tb-day-free .tb-day-dot{background:#B25A9E}

  /* Header: ⠿ handle + bold title (+ place) on the left, £ total right. */
  .tb-day-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-2);
    font:700 var(--fs-title) var(--font-sans);color:var(--ink);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;user-select:none;-webkit-user-select:none}
  .tb-day-title{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:var(--sp-2);overflow:hidden}
  /* "Day 3" must never be the thing that truncates — the place name absorbs
     the squeeze instead, which matters most at 375px. */
  .tb-day-title-text{flex:0 0 auto;white-space:nowrap}
  .tb-day-place{flex:1 1 auto;font:500 var(--fs-caption) var(--font-sans);color:var(--stone);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tb-day-sum{font:800 var(--fs-title) var(--font-sans);color:var(--accent-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* The thin divider under the header, straight from the sketch. */
  .tb-day-rule{height:1px;background:var(--line);margin:0 var(--sp-3)}

  /* Drag handle — was a bare 14px glyph with no padding (~10×14px of
     grabbable area). Now a full-height 32×44 target. */
  .tb-drag-handle{display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;
    width:28px;min-height:var(--tap);color:var(--stone);opacity:.45;font-size:var(--fs-lg);line-height:1;
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;border-radius:var(--radius-sm);
    transition:opacity var(--dur) var(--ease),background var(--dur) var(--ease)}
  .tb-day-course:hover .tb-drag-handle,.tb-day-head:hover .tb-drag-handle{opacity:1;background:var(--paper)}
  .tb-drag-handle:active{cursor:grabbing}

  /* A stop row. Golf reads heaviest; hotel/POI are the connective tissue. */
  .tb-day-course{position:relative;display:flex;align-items:center;gap:var(--sp-2);
    padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-2);cursor:grab;
    user-select:none;-webkit-user-select:none;border-radius:var(--radius-md);margin:2px var(--sp-2);
    background:#fff;transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .tb-day-course:hover{background:var(--paper-2)}
  .tb-day-course:active{cursor:grabbing}
  .tb-item-icon{flex:0 0 22px;width:22px;text-align:center;font-size:var(--fs-title);line-height:1;user-select:none}
  .tb-item-main{flex:1 1 auto;min-width:0;text-align:left}
  .tb-item-actions{display:flex;align-items:center;gap:var(--sp-1);flex-shrink:0}
  .tb-item-price{font:800 var(--fs-body) var(--font-sans);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tb-item-golf{box-shadow:inset 3px 0 0 var(--accent)}
  .tb-item-golf .tb-item-main>a,.tb-item-golf .tb-item-main>.tb-item-name{font:700 var(--fs-body) var(--font-sans);color:var(--ink);text-decoration:none}
  .tb-item-golf .tb-item-main>a:hover{color:var(--accent);text-decoration:underline}
  .tb-item-golf .tb-item-price{font-size:var(--fs-title);color:var(--accent-deep)}
  .tb-item-hotel .tb-item-name,.tb-item-poi .tb-item-name{font:500 var(--fs-small) var(--font-sans);color:var(--ink-soft)}
  .tb-item-hotel .tb-item-price,.tb-item-poi .tb-item-price{font-weight:600;font-size:var(--fs-small);color:var(--ink-soft)}
  .cart-region{color:var(--stone);font-size:var(--fs-caption)}
  .tb-item-hotel .cart-region,.tb-item-poi .cart-region{font-size:var(--fs-micro)}

  /* Drive caption — small, indented, sitting directly above the stop it
     leads into, exactly as sketched. Not a chip, not its own row of
     furniture; it is a label on the stop below it. */
  .tb-drive-cap{display:flex;align-items:center;gap:var(--sp-1);
    padding:var(--sp-1) var(--sp-3) 0 44px;font:600 var(--fs-micro) var(--font-sans);
    letter-spacing:.02em;color:var(--stone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-drive-cap .tb-drive-real{color:#1a7a3e}

  /* Day footer: the two add actions, sized as real targets. */
  .tb-day-add{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3) var(--sp-3);flex-wrap:wrap}
  .tb-day-add .tb-btn{flex:1 1 auto}

  /* Collapsed day settings (kind / city / date) — hidden in a dropdown so
     the card shows the itinerary, not a form. */
  .tb-day-settings{margin:0 var(--sp-3) var(--sp-2)}
  .tb-day-settings>summary{list-style:none;display:inline-flex;align-items:center;gap:var(--sp-1);
    min-height:var(--tap-sm);padding:0 var(--sp-2);border-radius:var(--radius-pill);cursor:pointer;
    font:600 var(--fs-caption) var(--font-sans);color:var(--stone)}
  .tb-day-settings>summary::-webkit-details-marker{display:none}
  /* Chevron rather than a ⚙ glyph: at this size a text-font gear renders
     as an illegible hairline (it read as a stray "e" in review). */
  .tb-day-settings>summary::after{content:'';width:5px;height:5px;border-right:2px solid currentColor;
    border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform var(--dur) var(--ease)}
  .tb-day-settings[open]>summary::after{transform:translateY(1px) rotate(-135deg)}
  .tb-day-settings>summary:hover{color:var(--accent);background:var(--accent-soft)}
  .tb-day-settings[open]>summary{color:var(--accent-deep)}
  .tb-day-settings-body{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-2) 0 var(--sp-1)}
  .tb-day-settings-body select,.tb-day-settings-body input{min-height:var(--tap-sm);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:0 var(--sp-2);background:#fff;font:500 var(--fs-small) var(--font-sans);color:var(--ink)}
  .tb-day-settings-body select:focus,.tb-day-settings-body input:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow-focus)}
  .tb-day-drive{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
    padding:var(--sp-1) 0 0;font-size:var(--fs-caption);color:var(--stone);width:100%}
  .tb-day-drive input{width:80px}
  .tb-auto-chip{display:inline-block;font:700 var(--fs-micro) var(--font-sans);letter-spacing:.04em;text-transform:uppercase;
    color:var(--accent-deep);background:var(--accent-soft);border-radius:var(--radius-xs);padding:2px 6px}
  .tb-auto-chip-real{color:#1a7a3e;background:#DCEFDC}
  .tb-day-town{padding:0 var(--sp-3) var(--sp-2) 44px;font-size:var(--fs-caption);color:var(--stone)}
  .tb-day-town b{color:var(--ink-soft)}
  .tb-poi-list{padding:0 var(--sp-3) var(--sp-2) 44px;display:flex;flex-direction:column;gap:3px}
  /* GOLF-83 fix: this used to be 3 bare flex children under
     justify-content:space-between — the same misalignment class GOLF-69e
     fixed for itinerary rows. With a variable-width name on one side and a
     fixed-width ＋ button on the other, space-between never actually
     centers the middle .wt tag; it just lands wherever the leftover space
     happens to split. Grid with explicit column assignments (rather than
     relying on source-order auto-placement, since the .wt tag is only
     present when a POI has a category) fixes this: the tag's own column is
     genuinely centered regardless of the name's length or whether the tag
     is present at all. */
  .tb-poi-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--sp-2);font-size:var(--fs-caption);color:var(--ink-soft)}
  .tb-poi-row>span:first-child{grid-column:1;justify-self:start;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-poi-row>.wt{grid-column:2;justify-self:center}
  .tb-poi-row>button{grid-column:3;justify-self:end}

  /* The grand-total card at the very bottom of the sketch. */
  .tb-total-card{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:var(--radius-lg);
    padding:var(--sp-4) var(--sp-5);box-shadow:var(--shadow-raised);margin:var(--sp-4) 0 var(--sp-3)}
  .tb-total-label{font:700 var(--fs-caption) var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:.8}
  .tb-total-amount{font:800 var(--fs-xl) var(--font-sans);color:#fff;font-variant-numeric:tabular-nums}

  /* ── Drag & drop feedback (GOLF-71 workstream D) ────────────────── */
  /* The lifted source. Applied one tick AFTER dragstart so the browser has
     already snapshotted the drag image — applying it synchronously would
     bake the lift into the ghost instead of leaving it on the placeholder. */
  .tb-drag-src{opacity:.4;transform:scale(.98)}
  .tb-day.tb-drag-src{opacity:.45}
  /* The row/card actually under the pointer lifts toward the cursor. */
  body.tb-dragging .tb-day-course.tb-drop-over,body.tb-dragging .tb-day.tb-drop-over{box-shadow:var(--shadow-dragging)}
  /* Insertion indicator: a real 3px accent line in a real gap, not a wash. */
  .tb-day-course.tb-drop-over::before,.tb-day.tb-drop-over::before{content:'';position:absolute;
    left:var(--sp-2);right:var(--sp-2);top:-3px;height:3px;border-radius:2px;background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .tb-day-course.tb-drop-over{background:var(--accent-soft);transform:translateY(1px)}
  .tb-day.tb-drop-over{border-color:var(--accent)}
  body.tb-dragging .tb-day{border-color:var(--line)}
  body.tb-dragging .tb-day-course{transition:none}
  /* End-of-day drop zone. Positioned ABSOLUTELY over the card's own bottom
     padding so revealing it mid-drag causes ZERO layout shift — the old
     display:none→flex swap moved every card below it the moment a drag
     began, which is a large part of why dragging felt like it "didn't pick
     things up": the target you aimed at had already moved. */
  .tb-dropzone{display:none}
  body.tb-dragging .tb-dropzone{display:flex;align-items:center;justify-content:center;
    position:absolute;left:var(--sp-2);right:var(--sp-2);bottom:var(--sp-2);height:40px;z-index:5;
    border:2px dashed var(--line);border-radius:var(--radius-md);background:rgba(255,255,255,.94);
    font:600 var(--fs-caption) var(--font-sans);color:var(--stone)}
  body.tb-dragging .tb-dropzone.tb-drop-over{border-color:var(--accent);border-style:solid;
    background:var(--accent-soft);color:var(--accent-deep);box-shadow:var(--shadow-md)}
  /* Same trick for the "move a day to last place" zone at the very end. */
  .tb-day-endzone{position:relative;border-radius:var(--radius-lg);transition:background var(--dur) var(--ease)}
  .tb-day-endzone.tb-drop-over{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

  /* ── Shared search-results dropdown (one component, four call sites) ── */
  .tb-place-wrap{position:relative;display:block}
  .tb-place-results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;max-height:240px;overflow-y:auto;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:var(--sp-1)}
  .tb-place-results:empty{display:none}
  .tb-place-row{display:flex;align-items:center;min-height:var(--tap-sm);padding:0 var(--sp-3);
    border-radius:var(--radius-sm);font-size:var(--fs-small);color:var(--ink);cursor:pointer}
  .tb-place-row:hover,.tb-place-row.is-active{background:var(--accent-soft);color:var(--accent-deep)}
  .tb-place-empty{display:flex;align-items:center;min-height:var(--tap-sm);padding:0 var(--sp-3);font-size:var(--fs-small);color:var(--stone)}

  /* Inline "add a stop" form. */
  .tb-addstop{margin:0 var(--sp-3) var(--sp-3);padding:var(--sp-3);background:var(--paper-2);
    border:1px solid var(--line);border-radius:var(--radius-md)}
  .tb-addstop-title{font:700 var(--fs-caption) var(--font-sans);letter-spacing:.04em;text-transform:uppercase;
    color:var(--stone);margin-bottom:var(--sp-2)}
  .tb-addstop-row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-2)}
  .tb-addstop-row input{flex:1 1 120px;min-width:0}
  /* GOLF-74 (ported into the GOLF-71 token system at merge time): per-room vs
     per-person-sharing toggle + guest count. Was written with hardcoded px
     against the old Trip Builder block that GOLF-71 replaced wholesale; the
     rules below are the same layout re-expressed in the spacing, font-size
     and radius tokens.
     The two flex:0 resets matter: .tb-addstop-row input above would otherwise
     stretch the radio buttons and the guests box to 120px each. */
  .tb-pricetype{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;
    font:500 var(--fs-caption) var(--font-sans);color:var(--stone)}
  .tb-pricetype label{display:inline-flex;align-items:center;gap:var(--sp-1);cursor:pointer;min-height:var(--tap-sm)}
  .tb-addstop-row .tb-pricetype input[type="radio"]{flex:0 0 auto;width:auto;min-width:0;margin:0}
  .tb-guests{display:inline-flex;align-items:center;gap:var(--sp-1);
    font:500 var(--fs-caption) var(--font-sans);color:var(--stone);white-space:nowrap}
  .tb-addstop-row .tb-guests input{flex:0 0 64px;width:64px;min-height:var(--tap-sm);
    padding:var(--sp-1) var(--sp-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    font:400 var(--fs-small) var(--font-sans);color:var(--ink)}

  /* ── Itinerary filtered lists + Costs tab ───────────────────────── */
  .itin-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);margin-bottom:var(--sp-3);padding:var(--sp-3) var(--sp-4)}
  .itin-card-head{font:800 var(--fs-caption) var(--font-sans);letter-spacing:.06em;color:var(--accent-dark);margin-bottom:var(--sp-1)}
  .itin-card-kicker{font:700 var(--fs-micro) var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--stone);margin-bottom:2px}
  .itin-flat-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2)}
  .itin-golf-name-lg{font:800 var(--fs-title) var(--font-sans)}
  .itin-golf-price-lg{font:800 var(--fs-lg) var(--font-sans);color:var(--accent-deep);font-variant-numeric:tabular-nums}
  .itin-hotel-name-md{font:600 var(--fs-body) var(--font-sans)}
  .itin-hotel-price-md{font:700 var(--fs-body) var(--font-sans);font-variant-numeric:tabular-nums}
  .itin-rail{position:relative;padding-left:var(--sp-4)}
  .itin-rail::before{content:'';position:absolute;left:3px;top:6px;bottom:6px;width:2px;background:var(--accent-soft)}
  .itin-rail-row{position:relative;margin-bottom:var(--sp-4)}
  .itin-rail-dot{position:absolute;left:-16px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

  .cost-banner{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:var(--radius-lg);
    padding:var(--sp-5);margin-bottom:var(--sp-4);box-shadow:var(--shadow-raised)}
  .cost-banner-label{font:700 var(--fs-caption) var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:.8}
  .cost-banner-amount{font:800 var(--fs-hero) var(--font-display);color:#fff;font-variant-numeric:tabular-nums;line-height:1.15}
  .cost-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--sp-2) var(--sp-4);margin-bottom:var(--sp-3)}
  .cost-summary-table,.cost-line-table{width:100%;border-collapse:collapse}
  .cost-summary-table td,.cost-line-table td{padding:var(--sp-3) 0;border-bottom:1px solid var(--line);font-size:var(--fs-small)}
  .cost-summary-table tr:last-child td,.cost-line-table tr:last-child td{border-bottom:none}
  .cost-summary-table td:first-child,.cost-line-table td:first-child{color:var(--ink)}
  .cost-summary-table td:last-child,.cost-line-table td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cost-fuel-toggle{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);cursor:pointer}
  .cost-fuel-toggle input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
  .cost-line-items-label{font:700 var(--fs-caption) var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
    color:var(--stone);margin:var(--sp-4) 0 var(--sp-2)}
  .cost-cov{margin:var(--sp-2) 0 0}
  /* Map marker for a day's hotel/POI stops (rendered by tbEmojiIcon). */
  .tb-emoji-marker{background:none;border:none;text-align:center;line-height:1}
  .tb-emoji-marker span{font-size:19px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}

  /* GOLF-31 refactor: cart list was hand-styled with inline `style=` per
     element — pulled into named classes so the checkout look is defined
     once, not repeated per row string. */
  .cart{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
  .cart-row:last-child{border-bottom:none}
  .cart-row:nth-child(even){background:var(--paper)}
  .cart-move{display:flex;flex-direction:column;flex-shrink:0}
  .cart-move .btn2{padding:1px 5px;font-size:9px;line-height:1}
  .cart-move .btn2+.btn2{margin-top:2px}
  .cart-course{min-width:0}
  .cart-idx{font-family:var(--font-mono);font-size:11px;color:var(--stone)}
  .cart-region{color:var(--stone);font-size:11.5px}
  .cart-price{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cart-fee{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--ink)}
  .cart-remove{padding:4px 8px;line-height:1}
  .cart-total{margin-top:10px;padding:12px 14px;background:linear-gradient(135deg,var(--ink),var(--accent-dark));border-radius:10px;display:flex;justify-content:space-between;align-items:baseline;box-shadow:var(--shadow-md)}
  .cart-total-label{color:var(--paper-2);font:600 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .cart-total-coverage{color:var(--paper-2);font-size:10.5px;opacity:.6}
  .cart-total-amount{color:#fff;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
  .cart-cost-lines{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .cart-cost-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:2px 0;cursor:pointer}
  .cart-cost-line span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink)}
  .cart-cost-line span:last-child{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
  .cart-cost-cov{font-size:10.5px;color:var(--stone);margin:-2px 0 2px 22px}

  /* GOLF-31: the old eyebrow/h1/standfirst mast ate ~140px of the panel's
     vertical space on every screen, including Trip Builder — traded for a
     single compact bar so filters/list/pane content start almost
     immediately. */
  .mast{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm);position:relative;z-index:1}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--ink)}
  #open-trip{display:inline-flex;align-items:center;font:600 12.5px var(--font-sans);color:var(--accent);background:var(--accent-soft);border:1px solid transparent;padding:7px 12px;border-radius:20px;text-decoration:none;transition:box-shadow .12s,transform .12s}
  #open-trip:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  #trip-badge{font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px}
  #trip-badge:empty{display:none}

  .filters{padding:11px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .flabel{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);display:block;margin-bottom:5px}
  .fgroup{border:none;padding:0;margin:0}
  .fgroup summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .fgroup summary::-webkit-details-marker{display:none}
  .fgroup summary::before{content:'▸';font-size:9px;color:var(--stone);transition:transform .12s}
  .fgroup[open] summary::before{transform:rotate(90deg)}
  .fgroup summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fbadge{font-family:var(--font-mono);font-size:9.5px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:8px;font-weight:600}
  /* GOLF-69 (item 2): all filters behind one dropdown, so the search box is
     the first thing in the panel instead of the sixth. */
  .fdrop>summary{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);margin-bottom:0}
  .fdrop[open]>summary{margin-bottom:9px}
  .fdrop-body{display:flex;flex-direction:column;gap:10px;padding:0 2px 2px}
  /* Green-fee range: two overlaid range inputs (a native two-thumb slider
     doesn't exist) plus typed min/max boxes, which is what the stakeholder
     asked for. pointer-events are off on the tracks and back on for the
     thumbs so both thumbs stay grabbable where they overlap. */
  .fee-range{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .fee-slider-wrap{position:relative;height:20px}
  .fee-slider-wrap input[type=range]{position:absolute;left:0;top:0;width:100%;margin:0;height:20px;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .fee-slider-wrap input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
  .fee-slider-wrap input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px}
  .fee-slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:15px;height:15px;margin-top:-6px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer}
  .fee-slider-wrap input[type=range]::-moz-range-thumb{pointer-events:auto;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer}
  .fee-inputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--stone)}
  .fee-inputs label{display:inline-flex;align-items:center;gap:4px}
  .fee-inputs input{width:66px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font:400 12px var(--font-sans)}
  .fee-readout{font:600 11px var(--font-mono);color:var(--accent-deep)}
  /* GOLF-69 (item 1): place hits from the geocoder, above the course list. */
  .explore-places{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper-2);display:flex;flex-direction:column;gap:4px}
  .explore-places[hidden],.list-mode[hidden]{display:none} /* [hidden] must beat the display:flex above */
  /* GOLF-72: the whole row is now one navigate-to-this-place button — Explore
     search does nothing but move the map, so there are no per-row actions. */
  .explore-place{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;
    width:100%;text-align:left;padding:5px 6px;border:1px solid transparent;border-radius:6px;background:none;color:inherit;cursor:pointer;font-family:var(--font-sans)}
  .explore-place:hover{border-color:var(--accent);background:#fff}
  .explore-place .ep-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .explore-place .ep-hint{flex-shrink:0;font-size:11px;color:var(--stone)}
  /* GOLF-69 (item 3): the list's own mode strip. */
  .list-mode{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--stone);flex-wrap:wrap}
  .list-mode-pills{display:flex;gap:4px}
