<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Britain Golf Explorer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Design refresh v2: dropped the separate monospace font entirely —
     --font-mono now just aliases --font-sans, with tabular-nums applied
     directly to the few number-bearing classes (.cart-fee, .cart-total-amount,
     .cfee, .fee-box span, #hc-out) so figures stay aligned without reading
     as code. Palette moved from the warm teal to "Links navy": --stone
     #5C6672 clears WCAG AA against both --paper (5.41:1) and --paper-2
     (5.31:1); --ink #1B2733 clears 14.07:1 against --paper (near-AAA);
     --accent #2E5C8A clears 6.33:1 as text on --paper-2 and 6.96:1 as
     white-on-accent for button labels; --accent-dark #1B4266 clears 8.78:1
     against --accent-soft. --paper/-2 dropped the cream/sepia cast for a
     cool near-white (panel is #F5F7F9, cards stay pure #fff on top of it)
     so the navy accent reads crisp rather than sitting on an off-white
     wash; --stone still clears 5.05:1 against --paper and 5.68:1 against
     --paper-2. All verified by hand, same discipline as the original
     GOLF-18 fix. */
  :root{
    --font-display:"Space Grotesk",var(--font-sans);
    --font-sans:"Manrope",ui-sans-serif,system-ui,sans-serif;
    --font-mono:var(--font-sans);
    --ink:#1B2733;--ink-soft:#3E4C5A;--paper:#EDF1F4;--paper-2:#F5F7F9;--line:#DCE2E7;--stone:#5C6672;
    --accent:#2E5C8A;--accent-dark:#1B4266;--accent-soft:#E4EDF4;
    /* GOLF-57: Trip Builder sidebar redesign — accent-deep is the
       text-on-tint colour for hero golf-price/name text (darker than
       --accent-dark so it still reads clearly on the pale --accent-soft
       fills used for pills/tags); radius tokens are new, this is the
       first part of the app that wants rounded cards/pills consistently. */
    --accent-deep:#122f76;
    --radius-sm:6px;--radius-md:10px;--radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(27,39,51,.06),0 1px 1px rgba(27,39,51,.08);
    --shadow-md:0 4px 14px rgba(27,39,51,.10),0 2px 4px rgba(27,39,51,.08);
    --shadow-lg:0 14px 40px rgba(27,39,51,.18),0 4px 10px rgba(27,39,51,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  button,input,select,textarea{font-family:inherit}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  .skip-link{position:absolute;left:8px;top:-40px;background:var(--ink);color:var(--paper-2);padding:8px 14px;border-radius:5px;font:600 12.5px var(--font-sans);text-decoration:none;z-index:3000;transition:top .12s}
  .skip-link:focus{top:8px}
  .app{display:grid;grid-template-columns:minmax(360px,420px) 1fr;height:100vh}
  /* GOLF-19: the old fixed 50vh panel/map split clipped the panel with
     overflow:hidden — on a real phone this made the search box, sort
     dropdown, and every button below the filter chips completely
     unreachable (confirmed: filters content ran ~715px tall, capped at
     406px, no scroll). Replaced with a full-height list<->map toggle. */
  .mob-toggle{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:1500;
    background:var(--ink);color:var(--paper-2);border:none;border-radius:22px;padding:12px 22px;
    font:600 13px var(--font-sans);box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:1fr}
    .panel{max-height:none}
    body.mob-map .panel{display:none}
    body.mob-list #map{display:none}
    .mob-toggle{display:block}
  }
  .panel{display:flex;flex-direction:column;background:var(--paper-2);border-right:1px solid var(--line);overflow:hidden;box-shadow:6px 0 24px -12px rgba(22,36,29,.25);position:relative;z-index:10}

  /* GOLF-31: Trip Builder pane — replaces .filters/.list in the same grid
     column (no .app layout change), following the same body-class toggle
     idiom already used for the mobile mob-list/mob-map split above. */
  .tb-pane{display:none;flex-direction:column;overflow-y:auto;flex:1}
  body.trip-mode .filters,body.trip-mode .list{display:none}
  body.trip-mode .tb-pane{display:flex}
  /* GOLF-41: #trip is a real, bookmarkable/shareable route — give the pane
     more room than the constrained list-panel width once it's the whole
     point of the page (map stays visible throughout, just narrower). */
  @media (min-width:901px){
    body.trip-mode .app{grid-template-columns:minmax(480px,680px) 1fr}
  }
  .tb-section{padding:11px 20px;border-bottom:1px solid var(--line)}
  .tb-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .tb-row:last-child{border-bottom:none}

  /* GOLF-31 refactor: cart list was hand-styled with inline `style=` per
     element — pulled into named classes so the checkout look is defined
     once, not repeated per row string. */
  .cart{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
  .cart-row:last-child{border-bottom:none}
  .cart-row:nth-child(even){background:var(--paper)}
  .cart-move{display:flex;flex-direction:column;flex-shrink:0}
  .cart-move .btn2{padding:1px 5px;font-size:9px;line-height:1}
  .cart-move .btn2+.btn2{margin-top:2px}
  .cart-course{min-width:0}
  .cart-idx{font-family:var(--font-mono);font-size:11px;color:var(--stone)}
  .cart-region{color:var(--stone);font-size:11.5px}
  .cart-price{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cart-fee{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--ink)}
  .cart-remove{padding:4px 8px;line-height:1}
  .cart-total{margin-top:10px;padding:12px 14px;background:linear-gradient(135deg,var(--ink),var(--accent-dark));border-radius:10px;display:flex;justify-content:space-between;align-items:baseline;box-shadow:var(--shadow-md)}
  .cart-total-label{color:var(--paper-2);font:600 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .cart-total-coverage{color:var(--paper-2);font-size:10.5px;opacity:.6}
  .cart-total-amount{color:#fff;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
  .cart-cost-lines{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .cart-cost-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:2px 0;cursor:pointer}
  .cart-cost-line span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink)}
  .cart-cost-line span:last-child{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
  .cart-cost-cov{font-size:10.5px;color:var(--stone);margin:-2px 0 2px 22px}
  /* GOLF-33: day-schedule blocks in the Trip Builder pane */
  .tb-day{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
  /* GOLF-51: a subtle left border distinguishes non-golf days (arrival/
     free/departure) from a normal golf day at a glance in the list, same
     idea as the map's per-day colour coding. */
  .tb-day-start,.tb-day-end{border-left:4px solid var(--stone)}
  .tb-day-free{border-left:4px solid #B25A9E}
  .tb-day-date select{margin-right:6px}
  .tb-day-date input[type="text"]{margin:0 6px}
  .tb-place-results{position:absolute;top:100%;left:6px;z-index:20;min-width:200px;max-height:180px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .tb-place-row{padding:6px 10px;font-size:12px;cursor:pointer}
  .tb-place-row:hover{background:var(--paper-2)}
  .tb-place-empty{padding:6px 10px;font-size:12px;color:var(--stone)}
  .tb-day-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--paper);font-weight:700;font-size:12.5px}
  .tb-day-drive{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--paper-2);font-size:11.5px;color:var(--stone)}
  .tb-day-drive input{width:60px}
  .tb-auto-chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  .tb-auto-chip-real{color:#1a7a3e;border-color:#1a7a3e}
  .tb-day-date{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--stone)}
  .tb-day-date input{margin:0 4px}
  .tb-day-town{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--stone)}
  .tb-day-town b{color:var(--ink)}
  .tb-poi-list{padding:2px 10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .tb-poi-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--ink)}
  .tb-poi-row .wt{font-size:9.5px}
  .tb-trips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tb-trips select{flex:1 1 140px;min-width:0}
  .tb-trips .btn2{padding:6px 10px;font-size:11.5px;flex:0 0 auto}
  .tb-day-course{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:grab}
  .tb-day-course:last-child{border-bottom:none}
  .tb-day-course:active{cursor:grabbing}
  .tb-day-course select{font-size:11px;max-width:120px}
  .tb-drag-handle{color:var(--stone);font-size:14px;flex-shrink:0;line-height:1;user-select:none}
  .tb-day-hotel,.tb-day-pois{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tb-day-pois .wt{display:inline-flex;align-items:center;gap:4px}
  .tb-day-pois .wt a{color:inherit;text-decoration:none;opacity:.7}
  .tb-day-pois .wt a:hover{opacity:1}

  /* GOLF-57: Trip Builder sidebar redesign — nav bar / unified search /
     tab row / itinerary filter row, the shared chrome sitting above
     whichever of the five tabs (Itinerary/Day/Costs/Add/Discover) is
     active. Named tb-* (not itin-*) since these sit above tab content,
     not inside any one tab. */
  .tb-navbar{padding:12px 20px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tb-wordmark{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink)}
  .tb-navbar-right{display:flex;align-items:center;gap:10px}
  .tb-pill{font:700 11px var(--font-mono);background:var(--accent-soft);color:var(--accent-deep);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tb-search-bar-wrap{padding:8px 20px;position:relative}
  .tb-search-bar{width:100%;padding:9px 11px 9px 30px;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;font:400 13px var(--font-sans);color:var(--ink)}
  .tb-search-bar:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .tb-search-bar-wrap::before{content:'';position:absolute;left:31px;top:50%;transform:translateY(-50%);width:13px;height:13px;
    border:2px solid var(--stone);border-radius:50%;box-sizing:border-box;pointer-events:none}
  .tb-search-bar-wrap::after{content:'';position:absolute;left:41px;top:50%;transform:translateY(4px) rotate(45deg);width:2px;height:7px;background:var(--stone);pointer-events:none}
  .tb-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 20px;border-bottom:1px solid var(--line)}
  .tb-tab-btn{font:800 10.5px/1 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;padding:8px 4px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--stone);cursor:pointer;transition:background .12s,color .12s}
  .tb-tab-btn:hover{color:var(--ink)}
  .tb-tab-btn[aria-pressed="true"]{background:var(--accent);color:#fff}
  .tb-filter-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tb-filter-pills{display:flex;gap:5px;flex-wrap:wrap}
  .tb-pill-btn{font:600 10.5px var(--font-sans);padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
  .tb-pill-btn:hover{border-color:var(--accent);color:var(--ink)}
  .tb-pill-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tb-drive-toggle{margin-left:auto}
  .tb-tab-content{padding:12px 20px 24px;flex:1}

  /* Itinerary tab: day cards, hero golf rows, flat filtered lists, hotel rail */
  .itin-card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-bottom:12px;padding:12px 14px}
  .itin-card-head{font:800 10.5px var(--font-mono);letter-spacing:.06em;color:var(--accent-dark);margin-bottom:6px}
  .itin-card-kicker{font:700 10px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--stone);margin-bottom:2px}
  .itin-leg{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:5px 0}
  .itin-leg-main{display:flex;align-items:baseline;gap:6px;min-width:0}
  .itin-leg-drive{font-size:10.5px;color:var(--stone);padding-left:6px}
  .itin-leg-golf{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
  .itin-golf-name{font:800 14px var(--font-sans);color:var(--ink)}
  .itin-golf-price{font:800 16px var(--font-mono);color:var(--accent-deep);white-space:nowrap;font-variant-numeric:tabular-nums}
  .itin-hotel-name{font:700 11.5px var(--font-sans);color:var(--ink)}
  .itin-hotel-price{font:700 11.5px var(--font-mono);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .itin-poi-name{font:700 11.5px var(--font-sans);color:var(--ink)}
  .itin-day-total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:7px;padding-top:7px}
  .itin-day-total span:first-child{font:800 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
  .itin-day-total span:last-child{font:800 15px var(--font-mono);color:var(--ink);font-variant-numeric:tabular-nums}
  .itin-flat{padding:10px 14px}
  .itin-flat-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .itin-golf-name-lg{font:800 15px var(--font-sans)}
  .itin-golf-price-lg{font:800 17px var(--font-mono);color:var(--accent-deep);font-variant-numeric:tabular-nums}
  .itin-hotel-name-md{font:700 13px var(--font-sans)}
  .itin-hotel-price-md{font:700 13px var(--font-mono);font-variant-numeric:tabular-nums}
  .itin-rail{position:relative;padding-left:16px}
  .itin-rail::before{content:'';position:absolute;left:3px;top:6px;bottom:6px;width:2px;background:var(--accent-soft)}
  .itin-rail-row{position:relative;margin-bottom:14px}
  .itin-rail-dot{position:absolute;left:-16px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

  /* Costs tab: receipt-style summary */
  .cost-banner{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:var(--radius-md);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-md)}
  .cost-banner-label{font:800 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:.85}
  .cost-banner-amount{font:800 40px var(--font-display);color:#fff;font-variant-numeric:tabular-nums;line-height:1.15}
  .cost-summary-table,.cost-line-table{width:100%;border-collapse:collapse;margin-bottom:8px}
  .cost-summary-table td,.cost-line-table td{padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .cost-summary-table td:first-child,.cost-line-table td:first-child{color:var(--ink)}
  .cost-summary-table td:last-child,.cost-line-table td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cost-line-items-label{font:800 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin:14px 0 4px}
  .cost-cov{margin:2px 0 0}

  /* GOLF-31: the old eyebrow/h1/standfirst mast ate ~140px of the panel's
     vertical space on every screen, including Trip Builder — traded for a
     single compact bar so filters/list/pane content start almost
     immediately. */
  .mast{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm);position:relative;z-index:1}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--ink)}
  #open-trip{display:inline-flex;align-items:center;font:600 12.5px var(--font-sans);color:var(--accent);background:var(--accent-soft);border:1px solid transparent;padding:7px 12px;border-radius:20px;text-decoration:none;transition:box-shadow .12s,transform .12s}
  #open-trip:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  #trip-badge{font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px}
  #trip-badge:empty{display:none}

  .filters{padding:11px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .flabel{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);display:block;margin-bottom:5px}
  .fgroup{border:none;padding:0;margin:0}
  .fgroup summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .fgroup summary::-webkit-details-marker{display:none}
  .fgroup summary::before{content:'▸';font-size:9px;color:var(--stone);transition:transform .12s}
  .fgroup[open] summary::before{transform:rotate(90deg)}
  .fgroup summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fbadge{font-family:var(--font-mono);font-size:9.5px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:8px;font-weight:600}
  .fgroup .chips{margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--font-sans);padding:6px 10px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--ink-soft);cursor:pointer;transition:background .12s,border-color .12s,color .12s,box-shadow .12s,transform .12s}
  .chip:hover{border-color:var(--accent);color:var(--ink);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
  .chip[aria-pressed="true"]:hover{transform:none;box-shadow:var(--shadow-sm)}
  .chip svg{display:block;flex:0 0 auto}
  .chip:focus-visible,.card:focus-visible,#q:focus-visible,.togg:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font:400 13px var(--font-sans);color:var(--ink);transition:border-color .12s,box-shadow .12s}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;color:var(--stone)}
  .toggles{display:flex;gap:5px;flex-wrap:wrap}
  .togg{font:500 11px var(--font-sans);padding:5px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink-soft);transition:background .12s,border-color .12s,color .12s}
  .togg[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
  .linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline}
  #sort{font:500 11px var(--font-sans);padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink-soft)}

  .list{overflow-y:auto;flex:1;padding:10px 12px 24px;display:flex;flex-direction:column;gap:7px}
  .card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .14s,transform .14s,border-color .14s}
  .card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--line)}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-md)}
  .card-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

<script>

/* Golf-flag marker: pole + triangular pennant + a small base ellipse
   standing in for the hole. Ranked courses get a thicker pole and a
   thin gold ring at the base instead of just being bigger. */
function flagSVG(colour,pole,size,ring){
  const w=size,h=size*1.3;
  const poleW=ring?2.4:1.6, poleX=w*0.28;
  const flagPts=`${poleX},${h*0.06} ${w*0.92},${h*0.24} ${poleX},${h*0.42}`;
  const strokeCol = colour==='#FFFFFF' ? '#9AA39C' : 'rgba(0,0,0,.18)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <ellipse cx="${poleX}" cy="${h*0.93}" rx="${w*0.24}" ry="${h*0.055}" fill="${pole}" opacity=".22"/>
    ${ring?`<circle cx="${poleX}" cy="${h*0.93}" r="${w*0.30}" fill="none" stroke="#E6B400" stroke-width="1.6"/>`:''}
    <line x1="${poleX}" y1="${h*0.05}" x2="${poleX}" y2="${h*0.95}" stroke="${pole}" stroke-width="${poleW}" stroke-linecap="round"/>
    <polygon points="${flagPts}" fill="${colour}" stroke="${strokeCol}" stroke-width="1"/>
  </svg>`;
}

const STN={},STN_LINES={};
Object.entries(R).forEach(([rk,arr])=>arr.forEach(([n,la,ln])=>{
  (STN_LINES[n]=STN_LINES[n]||new Set()).add(ROUTE_LINE[rk]);
  if(!STN[n])STN[n]={n,lat:la,lng:ln,l:ROUTE_LINE[rk]};
}));
ISOLATED.forEach(([n,la,ln,lk])=>{ if(!STN[n]){STN[n]={n,lat:la,lng:ln,l:lk};(STN_LINES[n]=STN_LINES[n]||new Set()).add(lk);} });
const isIX=n=>STN_LINES[n].size>1||MANUAL_IX.includes(n);

/* GOLF: a small "NR" badge next to a station when it's reached by National
   Rail, not the TfL network (Tube/Overground/Elizabeth/DLR) — those are the
   lines a Tube-only Oyster/contactless cap doesn't cover. Overground and
   Elizabeth line run partly on National Rail infrastructure but are TfL
   fare-zone/TfL-operated services, so they count as TfL here; every other
   entry in LINES (Thameslink, Great Northern, Chiltern, Southern,
   Southeastern, South Western, WCML) is a train-operating-company service —
   plus every nationwide GOLF-10 nearStation lookup, which by construction
   is always National Rail (it's a GB-wide station dataset, not a TfL one). */
const TFL_LINES=new Set(['met','jub','nor','pic','cen','dis','eli','ovg']);
function nrBadge(lineKey){
  if(lineKey!==undefined&&TFL_LINES.has(lineKey))return'';
  return ' <span title="National Rail service — not on the TfL network/Oyster cap" style="font-family:var(--font-mono);font-size:9px;background:#B5121B;color:#fff;padding:1.5px 5px;border-radius:3px;font-weight:600;letter-spacing:.03em">NR</span>';
}
/* GOLF: a small icon marker approximating the National Rail double-arrow
   roundel, placed directly at a station's coordinates — distinct from
   nrBadge() (which is text/CSS, used in labels/tooltips/popups) because
   this needs to be a real map marker, positioned exactly on the station,
   for the "nearest station" link line drawn on course selection. */
function nrRoundelIcon(size){
  size=size||24;
  return L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],html:
    `<svg width="${size}" height="${size}" viewBox="0 0 20 20" style="display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))">
      <rect x="0.75" y="0.75" width="18.5" height="18.5" rx="3" fill="#fff" stroke="#B5121B" stroke-width="1.5"/>
      <polygon points="2,6.5 9,6.5 9,3.5 17,10 9,16.5 9,13.5 2,13.5 2,11 7.5,11 7.5,9 2,9" fill="#B5121B"/>
    </svg>`});
}
function nrStationMarker(lat,lng,size){
  size=size||24;
  return L.marker([lat,lng],{interactive:true,icon:nrRoundelIcon(size)}).bindTooltip('National Rail station',{direction:'top',offset:[0,-size/2]});
}

function spline(pts,seg=14){
  if(pts.length<3)return pts;
  const p=[pts[0],...pts,pts[pts.length-1]],out=[];
  for(let i=1;i<p.length-2;i++){
    const[p0,p1,p2,p3]=[p[i-1],p[i],p[i+1],p[i+2]];
    for(let t=0;t<seg;t++){const s=t/seg,s2=s*s,s3=s2*s;
      out.push([.5*((2*p1[0])+(-p0[0]+p2[0])*s+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3),
                .5*((2*p1[1])+(-p0[1]+p2[1])*s+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)]);}
  }
  out.push(pts[pts.length-1]);return out;
}

/* architect tagging derived from the design credit */
function archTags(s){
  const t=s.toLowerCase(),out=new Set();
  if(/colt/.test(t))out.add("colt");
  if(/braid/.test(t))out.add("braid");
  if(/mackenzie/.test(t)&&!/mackenzie ross|tom mackenzie|mackenzie\s*(&|and)\s*ebert/.test(t))out.add("mackenzie");
  if(/abercromby/.test(t))out.add("abercromby");
  if(/taylor/.test(t))out.add("taylor");
  if(/hawtree/.test(t))out.add("hawtree");
  if(/vardon/.test(t))out.add("vardon");
  if(/park jr|willie park/.test(t))out.add("park");
  if(/fowler/.test(t))out.add("fowler");
  if(/ballesteros|nicklaus|phillips|ebert|jacobs|benz|mcevoy|williams|swan/.test(t))out.add("modern");
  return out;
}

const EDITS={};
function V(i,f){return(EDITS[i]&&EDITS[i][f]!==undefined)?EDITS[i][f]:C[i][f]}
function isEdited(i){return !!EDITS[i]&&Object.keys(EDITS[i]).length>0}
function editCount(){return Object.keys(EDITS).filter(isEdited).length}

/* GOLF-15: two distinct personal lists, not one generic "favourites" set.
   Marking a course played clears it from "want to play" — the two are
   mutually exclusive per course, played takes precedence. */
const PLAYED=new Set(),WANT=new Set();
function togglePlayed(i){if(PLAYED.has(i))PLAYED.delete(i);else{PLAYED.add(i);WANT.delete(i)}saveState();render();}
function toggleWant(i){if(WANT.has(i))WANT.delete(i);else{WANT.add(i);PLAYED.delete(i)}saveState();render();}

/* GOLF-28: the trip cart — a Set, same pattern as PLAYED/WANT, for O(1)
   membership checks (popup badges, "in trip" state). GOLF-31: display/map
   order is a separate array, tripSeq, since a Set can't be reordered
   in place — new adds append to the end, tbMove() lets the visitor drag
   the order into whatever sequence they actually want to play, and that
   choice persists (it's no longer silently overwritten by a recomputed
   nearest-neighbour guess on every render). */
const TRIP=new Set();
let tripSeq=[];
let tripLastAdded=null;
/* GOLF-33: day-by-day schedule layered over the flat cart. Each day is
   {id, courses:[courseIndex,...], driveIn:minutes|null} — driveIn is a
   manually-entered estimate of the drive to reach this day's first stop
   from wherever the previous day ended (no per-course-within-a-day or
   hotel-to-course timing, per this round's scope). Days are identified by
   a stable `id` (not array position) specifically so a future revision
   can attach a real calendar date to a day object without restructuring
   anything already keyed on day order. A course can only be scheduled
   once it's in TRIP — this is an arrangement of the existing cart, not a
   separate selection step, so search-to-add/discovery keep feeding it the
   same way they feed the flat cart today. */
let tripDays=[];
let tripDayNextId=1;
/* GOLF-51: kind labels a day that isn't a round of golf — 'start'/'end'
   for arrival/departure days with no course, 'free' for a rest day — vs
   the default 'golf'. place is a free-text town/city name shown on the
   day header (e.g. "Arrive in Edinburgh").
   GOLF-56: place can now also carry real coordinates (placeLat/placeLng,
   from the geocode search box) — when set, the place becomes a genuine
   waypoint in the route/drive-time/fuel model (tripDayStops() below),
   not just a display label. A day typed by hand without picking a search
   result keeps placeLat/placeLng null and stays purely cosmetic, exactly
   as before this ticket. */
const TRIP_DAY_KINDS={golf:'Golf day',start:'Start point',free:'Free day',end:'End point'};
function tripDayAdd(){tripDays.push({id:tripDayNextId++,courses:[],driveIn:null,date:null,kind:'golf',place:null,placeLat:null,placeLng:null,hotel:null,pois:[]});saveState();}
/* GOLF-57: a day's overnight stay and any points-of-interest stops —
   manually entered (name + optional £ price), since there's no hotel/POI
   database in this app to search against. hotel is null or {name,price};
   price null falls back to accomRateFor() at cost-estimate time, same as
   before this ticket. pois is a plain array of {name,price} — price is
   almost always null (no cost data for a POI), kept purely so a priced
   POI can still be added later without a schema change. */
function tripDaySetHotel(dayId,name,price){
  const d=tripDays.find(d=>d.id===dayId);if(!d)return;
  d.hotel=(name&&String(name).trim())?{name:String(name).trim().slice(0,80),price:(typeof price==='number'&&isFinite(price))?price:null}:null;
  saveState();

/* Removes a course from whichever day (if any) currently holds it —

/* GOLF-48: attaching a real date to a day is what lets the cost estimate

function tripDaySetPlace(dayId,value){

/* Courses in the cart not yet assigned to any day. */
function tripUnscheduled(){

let tbDrag=null;

function toggleTrip(i){

     "pick a nearby suggestion" path) — adding a course straight from a

     already-cleared trip in place, so the discovery list kept showing
     courses near wherever that stale anchor was. Now every add/remove
     keeps tbAnchor in sync with the cart itself: adding anchors to the
     course just added; removing the currently-anchored course re-anchors
     to whatever's now last, or clears to null once the cart is empty. */
  if(TRIP.has(i)){

    if(tbAnchor===i)tbAnchor=tripSeq.length?tripSeq[tripSeq.length-1]:null;
    tripDayRemoveCourse(i); // GOLF-33: no orphaned day references once a course leaves the cart
  }

  saveState();render();

     Trip Builder pane) previously gave no visible feedback beyond a small
     popup badge — the map itself never showed anything building. Now the
     cart's numbered route is always drawn/updated on the map, pane open
     or not, so a visitor can watch their trip take shape as they click

  if(!tripBuilderOn)tripDrawCart(true);

/* Swap a cart course one place earlier/later in tripSeq. */
function tbMove(i,dir){

  [tripSeq[idx],tripSeq[next]]=[tripSeq[next],tripSeq[idx]];
  saveState();

}

/* GOLF-42: multiple named trips, all local (no sharing/accounts). Rather
   than thread a tripId through every function that already reads/writes
   TRIP/tripSeq/tripDays/tripLastAdded/tbAnchor directly, `trips` holds a
   dictionary of named snapshots and the live globals above stay exactly
   what they were before this ticket: "the current trip's working state."
   tripSnapshotActive() copies the live globals into trips[activeTripId]
   (called from saveState(), so every existing mutation path — toggleTrip,
   tripDayAdd, tbMoveCourseTo, etc. — keeps every trip's stored snapshot
   fresh for free); tripRestoreActive() does the reverse when switching. */
let trips={default:{name:'My trip',created:Date.now(),modified:Date.now(),trip:[],tripSeq:[],tripDays:[],tripLastAdded:null,tbAnchor:null,tripDayNextId:1}};
let activeTripId='default';
function tripSnapshotActive(){
  if(!trips[activeTripId])trips[activeTripId]={name:'My trip',created:Date.now()};
  const t=trips[activeTripId];
  t.trip=[...TRIP];t.tripSeq=[...tripSeq];t.tripDays=JSON.parse(JSON.stringify(tripDays));
  t.tripLastAdded=tripLastAdded;t.tbAnchor=tbAnchor;t.tripDayNextId=tripDayNextId;
  t.modified=Date.now();

  tripDays=t&&Array.isArray(t.tripDays)?JSON.parse(JSON.stringify(t.tripDays)):[];
  tripLastAdded=t?(t.tripLastAdded??null):null;

function tripListAll(){

}

/* GOLF-31: Trip Builder pane state — a persistent left-pane mode (see

const LS_KEY='golfmap:v1';
let restoredView=null;
function loadStoredState(){
  let raw;try{raw=localStorage.getItem(LS_KEY)}catch(e){return}
  if(!raw)return;
  let saved;try{saved=JSON.parse(raw)}catch(e){return}
  if(saved.edits)Object.assign(EDITS,saved.edits);

  (saved.want||[]).forEach(i=>WANT.add(i));
  /* GOLF-42: multiple named trips. Two shapes handled: the current
     {trips:{id:{...}},activeTripId} shape, validated defensively per

        /* GOLF-48: optional real calendar date (YYYY-MM-DD), user-entered.

        date:(typeof d.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date))?d.date:null,
        /* GOLF-51: kind/place — see TRIP_DAY_KINDS.

        kind:TRIP_DAY_KINDS[d.kind]?d.kind:'golf',

      name:typeof t.name==='string'&&t.name.trim()?t.name.trim():'My trip',

function saveState(){

function clearStoredState(){try{localStorage.removeItem(LS_KEY)}catch(e){}}

const HOME=[51.5467873,-0.1798875];
/* GOLF-22: default sort was "by area" — REGIONS appends the 5 Top-100-only

   everything instead, so nothing is structurally buried by default. */
const state={access:new Set(),price:new Set(),region:new Set(),flag:new Set(),arch:new Set(),q:"",sort:"name"};
let map; // assigned below; loadStoredState reads state before map exists
loadStoredState();

const startView=restoredView||{center:[51.45,-0.15],zoom:9};
map=L.map('map',{scrollWheelZoom:true,zoomControl:false}).setView(startView.center,startView.zoom);
L.control.zoom({position:'bottomright'}).addTo(map);
/* GOLF: basemap went CartoDB Light -> OpenTopoMap -> CartoDB Voyager.
   OpenTopoMap's contour lines/terrain shading looked great on coastal
   links courses but were too busy at the country-wide "show all results"
   view, and Esri World Topo (compared side by side) was even busier —
   more place-name labels and a relief tint competing with the pins.
   Switched from CARTO's Voyager tiles to the standard OSM tile server —
   CARTO started gating rastertiles behind a "API key required" watermark
   for unauthenticated/high-volume traffic; the plain OSM tile server needs
   no key at all and has no such gate. */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);

const railLayer=L.layerGroup().addTo(map),lblLayer=L.layerGroup().addTo(map),
      stnLayer=L.layerGroup().addTo(map),stnLblLayer=L.layerGroup().addTo(map),
      linkLayer=L.layerGroup().addTo(map);

const railPolys=[],stnDots=[];
function railWeight(){const z=map.getZoom();return z<10?1.1:z<12?1.6:z<14?2.2:3}
function stnRadius(ix){const z=map.getZoom();const b=z<10?1.4:z<12?2:z<14?2.8:3.6;return ix?b*1.55:b}

/* GOLF: TfL-network families (met/jub/nor/pic/cen/dis/eli/ovg) draw from

   coordinates, which only ever approximated the route and looked visibly
   wrong once the basemap started showing real streets underneath it.
   National Rail groupings (Thameslink, Southern, etc.) have no single
   physical route to trace (they're our own station groupings by corridor,
   not one relation in OSM) so those keep the spline approximation. Each
   family's real geometry is drawn once (not once per branch key) since
   RAIL_GEOM already holds every distinct segment for that family. */
const geomDrawn=new Set();
Object.entries(R).forEach(([rk,stations])=>{
  const fam=ROUTE_LINE[rk],L_=LINES[fam];
  if(typeof RAIL_GEOM!=='undefined'&&RAIL_GEOM[fam]){
    if(!geomDrawn.has(fam)){
      geomDrawn.add(fam);
      RAIL_GEOM[fam].forEach(seg=>{
        const p=L.polyline(seg,{color:L_.c,weight:railWeight(),opacity:.95,dashArray:L_.d,lineCap:'round',lineJoin:'round'})
          .bindTooltip(L_.n,{sticky:true}).addTo(railLayer);

    const curve=spline(stations.map(s=>[s[1],s[2]]));
    const p=L.polyline(curve,{color:L_.c,weight:railWeight(),opacity:.95,dashArray:L_.d,lineCap:'round',lineJoin:'round'})
      .bindTooltip(L_.n,{sticky:true}).addTo(railLayer);

    L.marker([s[1],s[2]],{interactive:false,icon:L.divIcon({className:'',html:`<div class="lnlabel" style="background:${L_.c}">${L_.n}</div>`,iconSize:[0,0],iconAnchor:[-5,5]})}).addTo(lblLayer);

});

Object.values(STN).forEach(s=>{

  let ring=null;

const RAIL_MIN_ZOOM=9;

function restyleRail(){

/* GOLF-24: standalone Trip Planning mode — supersedes GOLF-14's inline
   "Same-day pairing" popup blurb, which only ever worked for London
   courses on a shared rail line (silently did nothing for all 100 Top 100
   entries — exactly where this is most wanted, e.g. Cornwall, the
   Liverpool coast). "Bookable" = pay&play/open access, not members-only
   or application-only, matching GOLF-14's original definition. Distance
   is straight-line (haversine, miles) — same approximation already used
   for GOLF-10's nearest-station lookups, not real routing. Browse-only:
   nothing here is persisted. */
function haversineMiles(lat1,lng1,lat2,lng2){
  const R=3958.8,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
/* "Bookable" = a visitor can actually book a round, even if only on
   certain days ("limited"). Only "application" (invitation-only, no
   public booking at all) is excluded. Verified this matters: every
   championship links course near Formby on the Liverpool coast — Royal
   Birkdale, Royal Liverpool, Hillside, West Lancs... — is tier "limited",
   so an public/open-only definition returned zero results for exactly
   the coastal-cluster case this feature exists for. */
function bookable(i){return['public','open','limited'].includes(V(i,'a'))}
/* GOLF-27: region mode has no real geometry to hand (REGIONS is a flat
   label list), so "just over the border" is derived from actual course
   geography instead of a hand-maintained adjacency table — any bookable
   course outside the chosen region whose straight-line distance to its
   single nearest course *inside* the region is within borderMiles is
   included, flagged {border:true} so the UI can explain why it's there. */
function tripByRegion(region,borderMiles){
  const inRegion=C.map((c,i)=>i).filter(i=>C[i].r===region&&bookable(i));
  const core=inRegion.map(i=>({i,border:false}));
  if(!borderMiles)return core.sort((a,b)=>V(a.i,'n').localeCompare(V(b.i,'n')));
  const outRegion=C.map((c,i)=>i).filter(i=>C[i].r!==region&&bookable(i));
  const border=outRegion.filter(i=>{
    let min=Infinity;
    inRegion.forEach(j=>{const d=haversineMiles(C[i].lat,C[i].lng,C[j].lat,C[j].lng);if(d<min)min=d});
    return min<=borderMiles;
  }).map(i=>({i,border:true}));
  return [...core,...border].sort((a,b)=>V(a.i,'n').localeCompare(V(b.i,'n')));
}
/* GOLF: a radius cutoff ("within 30 miles") left visitors guessing why
   the list was empty or overflowing depending on how remote the anchor
   was — a flat "nearest N" (straight-line) is a simpler, always-populated
   promise: sort every other bookable course by distance and take the
   closest `limit`. */
function tripByAnchor(anchor,limit){
  return C.map((c,i)=>i).filter(i=>i!==anchor&&bookable(i))
    .sort((a,b)=>haversineMiles(C[anchor].lat,C[anchor].lng,C[a].lat,C[a].lng)-haversineMiles(C[anchor].lat,C[anchor].lng,C[b].lat,C[b].lng))
    .slice(0,limit)
    .map(i=>({i,border:false}));
}

/* GOLF-28: Trip Builder — best-effort numeric extractor over a course's
   free-text fee field. Many fees are "Members only"/"Ask club"/ranges —
   this deliberately returns null rather than guessing when nothing
   numeric is found, so the caller can report an honest coverage count
   instead of a misleadingly precise total. */
function extractFee(s){
  if(!s)return null;
  const nums=[...String(s).matchAll(/(\d[\d,]*(?:\.\d+)?)/g)].map(m=>parseFloat(m[1].replace(/,/g,'')));
  if(!nums.length)return null;
  return nums.length>1?(nums[0]+nums[1])/2:nums[0];
}
function tripCostEstimate(indices){
  let total=0,covered=0;
  indices.forEach(i=>{const fee=extractFee(V(i,'wd'));if(fee!=null){total+=fee;covered++}});
  return{total,covered,of:indices.length};
}
/* GOLF-48: which fee field (wd/we) a scheduled day should be costed at —
   Saturday/Sunday if the day has a real calendar date attached, wd
   otherwise. A day with no date (the default — GOLF-33 deliberately
   ships day-numbers-only, no calendar anchoring) keeps exactly the old
   wd-only behavior, so this never regresses anyone who hasn't opted into
   dating their days. */
function feeFieldForDate(dateStr){
  if(!dateStr)return'wd';
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime()))return'wd';
  const dow=d.getDay(); // 0=Sun .. 6=Sat
  return(dow===0||dow===6)?'we':'wd';
}
/* GOLF-48: weekend-aware replacement for tripCostEstimate(tripSeq) in the
   cost summary below — a course scheduled on a dated day is costed at
   that day's correct wd/we rate; a course with no day-date (including
   every Unscheduled course, which has no day context at all) falls back
   to the plain wd-only behavior tripCostEstimate() already had. */
function tripCostEstimateByDay(){
  let total=0,covered=0,of=0;
  tripDays.forEach(d=>{
    const field=feeFieldForDate(d.date);
    d.courses.forEach(i=>{
      of++;
      const fee=extractFee(V(i,field));
      if(fee!=null){total+=fee;covered++;}
    });
  });
  tripUnscheduled().forEach(i=>{
    of++;
    const fee=extractFee(V(i,'wd'));
    if(fee!=null){total+=fee;covered++;}
  });
  return{total,covered,of};
}
/* GOLF-44: typical UK hotel nightly-rate estimate by region — NOT live
   pricing, a ballpark grounded via web search (London ~£120-180,
   Scotland ~£90-150, Wales ~£60-100, rest of UK ~£80-120 as of Aug 2026)
   and tiered across this app's existing REGIONS list. Refreshed the same
   on-demand way every other one-off dataset in this app is, not live. */
const ACCOM_RATE_BY_REGION={
  "N & NW London":110,"W London":110,"SW London":110,"S London & Surrey":110,
  "SE London & Kent":105,"NE London & Essex":105,"Herts":100,"Bucks & Berks":100,
  "South Coast & Sussex":95,"East Anglia":90,"South West England":100,
  "Midlands":85,"North of England":85,
  "Fife & East Lothian":100,"Angus & Aberdeenshire":90,"Ayrshire & Argyll":90,
  "Highlands & Islands":90,"Perthshire & Central Scotland":90,
  "South Wales Coast":75,"North Wales Coast":75,"West Wales":75,"Mid Wales":70,
  "North Wales":75,"South Wales Borders":75
};
const ACCOM_RATE_DEFAULT=95;
function accomRateFor(region){return ACCOM_RATE_BY_REGION[region]??ACCOM_RATE_DEFAULT;}
/* GOLF-44: fuel-cost estimate — same straight-line leg distances as the
   GOLF-43 drive-time default, x an assumed £/mile (roughly what a
   40mpg petrol car costs to run in Aug 2026 fuel prices). Both this and
   the accommodation estimate are separately toggleable in the UI so a
   visitor who thinks either number looks wrong can drop it from the
   total without losing the other. */
const FUEL_COST_PER_MILE=0.18;
let tbIncludeAccom=true,tbIncludeFuel=true;
function tripCostSummary(){
  const fees=tripCostEstimateByDay();
  let fuelMiles=0;
  for(let idx=1;idx<tripDays.length;idx++){const m=tripDayLegMiles(idx);if(m!=null)fuelMiles+=m;}
  const fuelCost=fuelMiles*FUEL_COST_PER_MILE;
  const scheduledDays=tripDays.filter(d=>d.courses.length);
  /* One night's stay per scheduled day except the last — no accommodation
     needed the night after the final round. */
  let accomCost=0;
  scheduledDays.forEach((d,idx)=>{
    if(idx===scheduledDays.length-1)return;
    accomCost+=accomRateFor(C[d.courses[d.courses.length-1]].r);
  });
  const nights=Math.max(0,scheduledDays.length-1);
  const grand=(fees.covered?fees.total:0)+(tbIncludeAccom?accomCost:0)+(tbIncludeFuel?fuelCost:0);
  return{fees,accomCost,nights,fuelMiles,fuelCost,grand};
}
function tripCostSummaryHTML(){
  const s=tripCostSummary();
  return`<div class="cart-cost-lines">
      <div class="cart-cost-line"><span>Green fees</span><span>${s.fees.covered?`£${s.fees.total.toFixed(0)}`:'—'}</span></div>

      <label class="cart-cost-line"><span><input type="checkbox" ${tbIncludeFuel?'checked':''} onchange="tbIncludeFuel=this.checked;renderTripBuilder();"> Fuel${s.fuelMiles?` (est. ${s.fuelMiles.toFixed(0)} mi)`:''}</span><span>${s.fuelMiles?`£${s.fuelCost.toFixed(0)}`:'—'}</span></label>
    </div>

/* Greedy nearest-neighbour walk, starting from the first-added course —
   "as the crow flies, not a real route," same disclaimer convention as
   nearStation elsewhere in the app. */
function tripOrder(indices){
  if(!indices.length)return[];
  const remaining=[...indices];
  const order=[remaining.shift()];
  while(remaining.length){
    const last=order[order.length-1];
    let bestIdx=0,bestDist=Infinity;
    remaining.forEach((i,idx)=>{
      const d=haversineMiles(C[last].lat,C[last].lng,C[i].lat,C[i].lng);
      if(d<bestDist){bestDist=d;bestIdx=idx}
    });
    order.push(remaining.splice(bestIdx,1)[0]);
  }

}

/* Friendly "Xh Ym" display for a minutes value over an hour — the
   underlying <input> stays a plain minutes number (simplest to type/step
   into), this is purely the human-readable label shown alongside it. */
function fmtDriveMinutes(mins){
  if(mins==null)return'—';
  const m=Math.round(mins);
  if(m<60)return`${m} min`;
  const h=Math.floor(m/60),rem=m%60;
  return rem===0?`${h}h`:`${h}h ${rem}m`;
}
function tripDayDriveHTML(d,idx){
  if(idx<=0)return'';

  const note=eff.auto
    ?(eff.minutes!=null
        ?(eff.real
            ?`<span class="tb-auto-chip tb-auto-chip-real">live</span> <span style="opacity:.75">real driving time via OpenRouteService — type a number to override</span>`
            :`<span class="tb-auto-chip">auto</span> <span style="opacity:.75">estimated from straight-line distance — type a real number if you know it</span>`)
        :`<span style="opacity:.75">(no estimate yet — add a course to both days)</span>`)
    :`<span style="opacity:.75">(your estimate — real directions coming later)</span>`;
  const shown=d.driveIn??eff.minutes;
  const friendly=shown!=null?` <b>(${fmtDriveMinutes(shown)})</b>`:'';
  return`<div class="tb-day-drive">Drive to today's first stop: <input type="number" min="0" step="5" value="${d.driveIn??''}" placeholder="${eff.auto&&eff.minutes!=null?eff.minutes:'—'}" onchange="tripDaySetDriveIn(${d.id},this.value===''?null:parseFloat(this.value));renderTripBuilder();"> min${friendly} ${note}</div>`;
}
/* GOLF-34a: a plain suggested overnight place per day — no new data
   source/API, just reuses whichever nearest-station name (stn/nearStation,
   both already carry a real place name, often a town) the day's LAST
   course already has, since that's roughly where the night starts.
   Falls back to the course's region if no station data exists at all;
   returns null (rendered as nothing) if neither is available. */
function tripDaySuggestedTown(day){
  if(!day.courses.length)return null;
  const i=day.courses[day.courses.length-1];
  const stnObj=STN[V(i,'stn')],near=C[i].nearStation,s=stnObj||near;
  if(s&&s.n)return s.n;
  return C[i].r||null;
}
/* GOLF-46: "Show POIs" per overnight stop — food/fuel/accommodation near
   where a day ends, via the same Cloudflare Worker proxy as GOLF-45's
   drive times, hitting ORS's POI endpoint instead of its directions one
   (routed server-side by a `mode:'pois'` field the Worker checks first).
   Same "inert until ORS_PROXY_URL is set" and "cache, don't re-fetch a
   view that hasn't changed" pattern as GOLF-45, so this never regresses
   anything when the proxy isn't configured. */
/* ORS caps category_ids at 5 values per request (confirmed against the
   live API — a 6th silently 400s), so this is deliberately narrowed to
   the 5 most useful "near tonight's stop" categories rather than every
   food/fuel/stay id ORS knows about: fuel, restaurant, fast food, hotel,
   guest house. Café/bar/hostel are dropped to fit the cap. */
const POI_CATEGORIES=[596,570,566,108,106];
const POI_CACHE_KEY='golfmap:poicache:v1';
function poiCacheLoad(){try{return JSON.parse(localStorage.getItem(POI_CACHE_KEY)||'{}');}catch(e){return{};}}
function poiCacheSave(c){try{localStorage.setItem(POI_CACHE_KEY,JSON.stringify(c));}catch(e){}}
function poiKey(lat,lng){return lat.toFixed(4)+','+lng.toFixed(4);}
let poiPending=new Set();
/* dayIds currently toggled "on" — pure UI state, not persisted, same as
   GOLF-44's cost-line checkboxes (resets to hidden on reload). */
let tbPoiOn=new Set();
function tbPoiPoint(day){
  if(!day.courses.length)return null;
  const i=day.courses[day.courses.length-1];
  return{lat:C[i].lat,lng:C[i].lng};
}
/* Returns a cached POI array for this day's overnight point, or null if
   not yet known (not configured, no point yet, still loading, or the
   call failed) — mirrors tripDayRealEstimate()'s contract exactly. A
   cache miss fires the async fetch + cache + re-render itself. */
function tbPoisFor(day){
  if(!ORS_PROXY_URL)return null;
  const pt=tbPoiPoint(day);
  if(!pt)return null;
  const key=poiKey(pt.lat,pt.lng);
  const cache=poiCacheLoad();
  if(cache[key])return cache[key].pois;
  if(poiPending.has(key))return null;
  poiPending.add(key);
  const categories=POI_CATEGORIES;
  fetch(ORS_PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode:'pois',point:[pt.lng,pt.lat],radius:1500,categories})})
    .then(r=>r.ok?r.json():Promise.reject(new Error('proxy error '+r.status)))
    .then(data=>{
      if(data&&Array.isArray(data.pois)){
        const c=poiCacheLoad();
        c[key]={pois:data.pois,ts:Date.now()};
        poiCacheSave(c);
        if(tripBuilderOn){renderTripBuilder();tbDrawMap();}
      }
    })
    .catch(()=>{ /* silent — toggle just stays empty, nothing to show the user */ })
    .finally(()=>{poiPending.delete(key);});
  return null;
}
function tbTogglePois(dayId){
  if(tbPoiOn.has(dayId))tbPoiOn.delete(dayId);else tbPoiOn.add(dayId);
  renderTripBuilder();tbDrawMap();
}
function tbPoiListHTML(day){
  if(!tbPoiOn.has(day.id))return'';
  if(!ORS_PROXY_URL)return'';
  const pois=tbPoisFor(day);
  if(pois==null)return`<div class="tb-poi-list"><p class="hint" style="margin:4px 10px">Loading nearby food, fuel and places to stay…</p></div>`;
  if(!pois.length)return`<div class="tb-poi-list"><p class="hint" style="margin:4px 10px">Nothing found nearby.</p></div>`;
  return`<div class="tb-poi-list">${pois.map(p=>`<div class="tb-poi-row"><span>${p.name}</span>${p.category?`<span class="wt">${p.category}</span>`:''}</div>`).join('')}</div>`;
}
/* GOLF-57: Trip Builder sidebar redesign — a "leg" is one row in the
   Itinerary tab's day cards: drive (getting to today), golf (a round),
   poi (a manually-added stop), hotel (where the day ends). Built
   entirely from tripDays — no new persisted shape beyond GOLF-57's own
   hotel/pois fields, this is just a different way of laying the same
   data out. Order is drive -> golf(s) -> poi(s) -> hotel, since a hotel
   is naturally where the day *ends*. */
function tripDayLegs(dayIdx){
  const d=tripDays[dayIdx];if(!d)return[];
  const legs=[];
  if(dayIdx>0){
    const prev=tripDayLastStop(dayIdx-1),cur=tripDayFirstStop(dayIdx);
    const eff=tripDayEffectiveDriveIn(dayIdx);
    const mins=d.driveIn??eff.minutes;
    if(prev&&cur)legs.push({type:'drive',label:`${prev.name} → ${cur.name}`,mins});
  }
  const field=feeFieldForDate(d.date);
  d.courses.forEach(i=>legs.push({type:'golf',name:V(i,'n'),price:extractFee(V(i,field)),i}));
  (d.pois||[]).forEach((p,idx)=>legs.push({type:'poi',name:p.name,price:p.price,idx}));
  if(d.hotel&&d.hotel.name){
    const price=d.hotel.price??(d.courses.length?accomRateFor(C[d.courses[d.courses.length-1]].r):null);
    legs.push({type:'hotel',name:d.hotel.name,price});
  }
  return legs;
}
function tripDayTotal(dayIdx){
  return tripDayLegs(dayIdx).reduce((sum,l)=>sum+(l.type!=='drive'&&l.price!=null?l.price:0),0);

function itinLegRowHTML(l){

  if(l.type==='hotel')return`<div class="itin-leg itin-leg-hotel"><span class="itin-leg-main">🛏 <span class="itin-hotel-name">${esc(l.name)}</span></span><span class="itin-hotel-price">${l.price!=null?`£${l.price.toFixed(0)}`:'—'}</span></div>`;
  if(l.type==='poi')return`<div class="itin-leg itin-leg-poi"><span class="itin-leg-main">📷 <span class="itin-poi-name">${esc(l.name)}</span></span><span class="wt">POI</span></div>`;

/* Costs tab: a full line-item breakdown, distinct from the older
   tripCostSummary()/tripCostSummaryHTML() (kept, defined but no longer
   called — the Day tab now links to this Costs tab instead of repeating
   a compact estimate inline) — this one itemises every
   golf/hotel/POI cost individually rather than just totalling them, and
   folds a day's explicit hotel price in ahead of the regional estimate. */
function tripCostLineItems(){
  const items=[];
  tripDays.forEach((d,idx)=>{
    const field=feeFieldForDate(d.date);
    d.courses.forEach(i=>items.push({label:V(i,'n'),cat:'Golf',amount:extractFee(V(i,field)),day:idx+1}));
    if(d.hotel&&d.hotel.name){
      const price=d.hotel.price??(d.courses.length?accomRateFor(C[d.courses[d.courses.length-1]].r):null);
      items.push({label:d.hotel.name,cat:'Stay',amount:price,day:idx+1});
    }
    (d.pois||[]).forEach(p=>items.push({label:p.name,cat:'POI',amount:p.price,day:idx+1}));
  });
  tripUnscheduled().forEach(i=>items.push({label:V(i,'n'),cat:'Golf',amount:extractFee(V(i,'wd')),day:null}));
  return items;
}
function tripCostBreakdown(){
  const items=tripCostLineItems();
  const sum=arr=>arr.reduce((t,x)=>t+(x.amount||0),0);
  const golf=items.filter(x=>x.cat==='Golf'),stay=items.filter(x=>x.cat==='Stay'),poi=items.filter(x=>x.cat==='POI');
  let fuelMiles=0;for(let idx=1;idx<tripDays.length;idx++){const m=tripDayLegMiles(idx);if(m!=null)fuelMiles+=m;}
  const fuelCost=fuelMiles*FUEL_COST_PER_MILE;
  const golfTotal=sum(golf),stayTotal=sum(stay),poiTotal=sum(poi);
  const grand=golfTotal+stayTotal+poiTotal+(tbIncludeFuel?fuelCost:0);
  return{items,golfTotal,golfCov:golf.filter(x=>x.amount!=null).length,golfOf:golf.length,stayTotal,poiTotal,fuelMiles,fuelCost,grand};
}

/* GOLF-57: Trip Builder sidebar redesign — five tabs (Itinerary/Day/

function renderTripBuilder(){

function enterTripBuilder(seedAnchor,opts){

     (not a plain location.hash= assignment) so entering doesn't clobber
     a legitimate earlier back-stack entry, and the popstate listener
     below is the single source of truth for what "back" does. */
  if(pushHash&&location.hash!=='#trip')history.pushState({trip:true},'','#trip');
}
function exitTripBuilder(opts){
  const pushHash=!opts||opts.pushHash!==false;

     discovery-candidate overlay goes away, not the trip itself. */

/* GOLF-41: back/forward button support — popstate fires on both real

  if(location.hash==='#trip'){if(!tripBuilderOn)enterTripBuilder(null,{pushHash:false});}

});

/* GOLF-13: Course Handicap calculator. The formula itself needs no data
   source. courseStats (par/slope/course rating) pre-fills the inputs when
   we have it via GOLF-12 — currently unpopulated for every course pending
   a free data source — but the calculator is not gated on that: any field
   we don't have, the visitor can type in themselves (e.g. off their own
   scorecard), so the tool works on every course today rather than staying
   invisible until GOLF-12 lands. */
function courseHandicap(hcIndex,slope,rating,par){
  return Math.round(hcIndex*(slope/113)+(rating-par));
}
function calcHTML(i){
  const cs=V(i,'courseStats')||{};
  const tees=(cs.tees&&cs.tees.length)?cs.tees:(cs.par!=null?[{name:'',par:cs.par,slope:cs.slope,rating:cs.rating}]:[]);

  const teeSelect=tees.length>1?`<div style="margin-bottom:7px"><label for="hc-tee-${i}" style="display:block;font:500 9px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin-bottom:3px">Tee</label><select id="hc-tee-${i}" onchange="applyTee(${i})" style="width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:5px;font:400 12px var(--font-sans)">${tees.map((t,idx)=>`<option value="${idx}">${esc(t.name||'Tee '+(idx+1))}</option>`).join('')}</select></div>`:'';
  return `<div class="note" style="border-top:1px solid var(--line);padding-top:8px;margin-top:9px">
    <button class="btn ghost" id="hc-toggle-${i}" onclick="toggleCalc(${i})">Calculate your handicap</button>
    <div id="hc-body-${i}" style="display:none;margin-top:8px">
      <b style="display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-bottom:5px">Course Handicap calculator</b>
      <p style="margin:0 0 7px;font-size:11px;color:var(--stone)">${tees.length?`We have this course's par/slope/rating pre-filled below.`:`We don't have this course's par/slope/rating yet — enter them from your scorecard, or add it via "Correct this".`}</p>
      ${teeSelect}
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px">
        ${fld(`hc-par-${i}`,'Par',first.par)}
        ${fld(`hc-slope-${i}`,'Slope',first.slope)}
        ${fld(`hc-rating-${i}`,'Rating',first.rating,0.1)}
        ${fld(`hc-idx-${i}`,'Your Index',undefined,0.1)}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost" onclick="runCalc(${i})">Calculate</button>
        <span id="hc-out-${i}" style="font-variant-numeric:tabular-nums;font-size:13px;font-weight:600"></span>
      </div>
    </div>
  </div>`;
}
function applyTee(i){
  const t=HC_TEES[i][document.getElementById(`hc-tee-${i}`).value];
  document.getElementById(`hc-par-${i}`).value=t.par!=null?t.par:'';

function toggleCalc(i){
  const body=document.getElementById(`hc-body-${i}`),btn=document.getElementById(`hc-toggle-${i}`);

function runCalc(i){
  const par=parseFloat(document.getElementById(`hc-par-${i}`).value);

function feeNum(i){const m=String(V(i,'wd')).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):9999}
function distOut(i){const dy=C[i].lat-HOME[0],dx=(C[i].lng-HOME[1])*Math.cos(HOME[0]*Math.PI/180);return Math.hypot(dy,dx)}
/* GOLF-16: distOut() is in degrees (used internally for sorting); miles
   at ~69 mi/degree latitude is accurate enough for a labelled "as the
   crow flies" stat, not for anything requiring real precision. */
function distMiles(i){return Math.round(distOut(i)*69)}
function rankNum(i){const t=C[i].t100;if(!t)return 9999;if(typeof t.gl==='number')return t.gl;if(t.gbi)return t.gbi/20;return 500}
function passes(i){const c=C[i];
  if(state.access.size&&!state.access.has(V(i,'a')))return false;
  if(state.price.size&&!state.price.has(V(i,'band')))return false;
  if(state.region.size&&!state.region.has(c.r))return false;
  if(state.arch.size){const tags=archTags(V(i,'arch'));if(![...state.arch].some(a=>tags.has(a)))return false}
  if(state.flag.has('ranked')&&!ranked(i))return false;
  if(state.flag.has('weekend')&&/members only|closed|restricted/i.test(V(i,'we')))return false;
  if(state.flag.has('walk')&&!/walk|minute/i.test(V(i,'walk')))return false;
  if(state.flag.has('winter')&&!c.winter)return false;
  if(state.flag.has('sweep')&&!c.sweep)return false;
  if(state.flag.has('top100')&&!c.top100)return false;
  if(state.flag.has('topScot')&&!c.topScot)return false;
  if(state.flag.has('topWales')&&!c.topWales)return false;
  if(state.flag.has('edited')&&!isEdited(i))return false;
  if(state.flag.has('played')&&!PLAYED.has(i))return false;
  if(state.flag.has('want')&&!WANT.has(i))return false;
  if(state.q&&!searchMatches(i,state.q))return false;
  return true}

/* GOLF-20: exact substring match stays the primary, fast path (unchanged
   behavior for anyone typing something that actually appears verbatim).
   Fuzzy only kicks in as a fallback so a typo doesn't return zero results
   — checked word-by-word against the searchable text, not as one long
   Levenshtein diff against the whole blob, so "Sunningdle" still finds
   "Sunningdale" inside a longer name/note without needing the whole
   string to nearly match. */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=a[i-1]===b[j-1]?prev[j-1]:1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}
function searchMatches(i,q){
  const c=C[i],s=V(i,'stn')||'';
  const text=(V(i,'n')+' '+c.r+' '+V(i,'arch')+' '+V(i,'note')+' '+V(i,'walk')+' '+s).toLowerCase();
  if(text.includes(q))return true;
  if(q.length<3)return false; // too short for fuzzy to mean anything, avoid noisy matches
  const threshold=q.length<=5?1:2;
  return text.split(/\W+/).some(word=>word.length>=q.length-threshold&&levenshtein(q,word)<=threshold);
}
function highlight(i){document.querySelectorAll('.card').forEach(el=>el.classList.toggle('active',+el.dataset.i===i));
  const el=document.querySelector(`.card[data-i="${i}"]`);if(el)el.scrollIntoView({block:'nearest'})}

/* GOLF-22: default map view (London, zoom 9) hides every Top 100 course
   hundreds of miles away with no on-screen hint to zoom out. This gives
   an explicit, discoverable way to see wherever the current filters

function fitToResults(){
  const shown=C.map((c,i)=>i).filter(passes);

function render(){
  /* GOLF-31: single hook point — every existing render() call site
     (filter chips, played/want/trip toggles, corrections save, reset,
     wipeStoredState) keeps the Trip Builder pane and the mast's cart-count
     badge in sync for free. */
  document.getElementById('trip-badge').textContent=TRIP.size?String(TRIP.size):'';
  if(tripBuilderOn){renderTripBuilder();tbDrawMap();}
  layer.clearLayers();
  /* Map-clutter fix: with all 326 course markers still clustering
     underneath it, the Trip Builder route got lost in whichever dense
     area (usually London) happened to be on screen, regardless of where
     the trip actually was. The pane already replaces the filter/course
     list entirely — the full marker layer is redundant screen noise
     while it's open, so skip populating it and let tripLayer (the
     cart/discovery markers) be the only thing on the map. Filters/list
     stay untouched underneath, ready the moment Trip Builder exits. */
  if(tripBuilderOn)return;
  let shown=C.map((c,i)=>i).filter(passes);
  const S_={region:(a,b)=>REGIONS.indexOf(C[a].r)-REGIONS.indexOf(C[b].r)||feeNum(a)-feeNum(b),
    fee:(a,b)=>feeNum(a)-feeNum(b),rank:(a,b)=>rankNum(a)-rankNum(b),
    dist:(a,b)=>distOut(a)-distOut(b),name:(a,b)=>V(a,'n').localeCompare(V(b,'n'))};
  shown.sort(S_[state.sort]);
  shown.forEach(i=>{markers.get(i).setIcon(pinFor(i));markers.get(i).setPopupContent(popupHTML(i));layer.addLayer(markers.get(i))});
  document.getElementById('count').textContent=`${shown.length} of ${C.length}`;
  document.getElementById('editcount').textContent=editCount();
  const list=document.getElementById('list');
  if(!shown.length){list.innerHTML=`<p class="empty">Nothing matches. The cheapest heathland tends to be weekdays-only — try dropping that filter.</p>`;return}
  list.innerHTML=shown.map(i=>{const a=ACCESS[V(i,'a')],stn=STN[V(i,'stn')],near=C[i].nearStation;
    return `<button class="card" data-i="${i}"><div class="card-top">
      <p class="cname">${flagSVG(a.colour,a.pole,15,false)}${V(i,'n')}${isEdited(i)?' <span class="edited">EDITED</span>':''}${PLAYED.has(i)?' <span class="wt played">played</span>':WANT.has(i)?' <span class="wt want">want</span>':''}</p>
      <span class="cfee">${V(i,'wd')}<small>wknd ${V(i,'we')}</small></span></div>
      <p class="cmeta"><span>${a.label}</span>
      ${stn?`<span>${stn.n} · ${LINES[stn.l].n}</span>`:near?`<span>${near.n} · ${near.mi} mi straight-line</span>`:`<span style="color:var(--stone)">no close station</span>`}
      ${(C[i].top100||C[i].topScot||C[i].topWales)?`<span style="color:var(--stone)">${distMiles(i)} mi from home</span>`:''}
      ${bestRankBadge(i)}${C[i].sweep?'<span class="wt">sweep</span>':''}${C[i].winter?'<span class="wt">winter</span>':''}</p></button>`}).join('');
  list.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>{
    const i=+el.dataset.i;showMobileMap();map.flyTo([C[i].lat,C[i].lng],13,{duration:.6});
    markers.get(i).setPopupContent(popupHTML(i));markers.get(i).openPopup();highlight(i);drawLink(i)}));
}
