# Config for Cloudflare's "Connect to Git" auto-deploy (see README.md).
#
# IMPORTANT: `name` must match your *existing* Worker's name exactly —
# check it in the Cloudflare dashboard (Workers & Pages -> your Worker ->
# the name shown at the top of its overview page). If this doesn't match,
# Cloudflare will create a brand-new Worker (with its own new URL and no
# ORS_API_KEY secret) instead of taking over deploys for the one you
# already have. Update the line below to the real name before connecting.
name = "geofftheworker"
main = "ors-proxy.js"
compatibility_date = "2026-08-27"

# ORS_API_KEY is NOT set here — it stays exactly as it is today, a
# secret configured in the dashboard (Settings -> Variables and Secrets).
# Connecting Git for deploys doesn't touch secrets at all.
